# Makes a release when a version's tag is pushed:
#   git tag v0.1.0
#   git push origin v0.1.0
# On Windows, Linux and macOS it tests the engine and editor and makes that system's download with
# Tools/Release/Build.ps1; then it publishes them all as one GitHub release, which the docs site's Download page lists.
# A version with a dash (v0.2.0-beta.1) is marked a pre-release.
#
# Run by hand (Actions > Release > Run workflow), it makes the downloads without releasing them: they're kept with the
# run, to try first.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: |
          dotnet test Vertex.Tests -c Release
          dotnet test Vertex.Editor.Tests -c Release

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-build.${{ github.run_number }}" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Make the download
        shell: pwsh
        run: ./Tools/Release/Build.ps1 -Version ${{ steps.version.outputs.value }} -Runtime ${{ matrix.runtime }}

      # The engine's package is the same everywhere: it's kept from the Windows build only.
      - name: One engine package
        if: matrix.runtime != 'win-x64'
        shell: pwsh
        run: Remove-Item dist/*.nupkg

      - name: Keep it with the run
        uses: actions/upload-artifact@v4
        with:
          name: Vertex-${{ steps.version.outputs.value }}-${{ matrix.runtime }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.nupkg

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # every commit and tag, for the release's list of changes

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")

          # What's changed since the last release, from the commits (their messages say what changed for the user).
          $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
          $changes = if ($LASTEXITCODE -eq 0 -and $previous) { git log "$previous..$tag" --no-merges --format="- %s" } else { $null }

          $notes = @(
            "Download the one for your system, unpack it, and run the editor in its ``Editor`` folder:"
            ""
            "- **Windows:** Vertex-$version-win-x64.zip, then ``Editor\Vertex.Editor.exe``."
            "- **Linux:** Vertex-$version-linux-x64.tar.gz, then ``./Editor/Vertex.Editor``."
            "- **macOS (Apple silicon):** Vertex-$version-osx-arm64.tar.gz. Once, in a terminal in the unpacked folder: ``xattr -dr com.apple.quarantine .``, then ``./Editor/Vertex.Editor``."
            ""
            "Each needs a graphics card with Vulkan or OpenGL 3.3 (a Mac renders with OpenGL) and the [.NET 10 SDK](https://dotnet.microsoft.com/download/dotnet/10.0). The README inside says what's where, and the [documentation](https://biggystudios.github.io/Vertex/) has tutorials."
            ""
            "**Vertex.Engine.$version.nupkg** is the engine on its own, for games written in code."
            ""
            "## What's changed"
            ""
          )
          $notes += if ($changes) { $changes } else { "- The first release." }
          $notes | Set-Content release-notes.md -Encoding utf8

          $flags = @("--title", "Vertex $version", "--notes-file", "release-notes.md")
          if ($version.Contains("-")) { $flags += "--prerelease" }
          gh release create $tag (Get-ChildItem dist -File).FullName @flags
